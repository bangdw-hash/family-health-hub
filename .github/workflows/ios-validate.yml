name: Family Health Hub - iOS Simulator Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build shared web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.FHH_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FHH_SUPABASE_PUBLISHABLE_KEY }}
          VITE_KAKAO_JS_KEY: ${{ vars.FHH_KAKAO_JS_KEY }}
      - run: npx cap add ios && npx cap sync ios
      - name: Compile iOS Simulator target
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
