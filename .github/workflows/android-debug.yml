name: Family Health Hub - Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ccr-d22dfd19-juxqxs, dev/family-health-hub-supabase-v1]
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME" && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - run: npm install --no-audit --no-fund
      - name: Build shared web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.FHH_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FHH_SUPABASE_PUBLISHABLE_KEY }}
          VITE_KAKAO_JS_KEY: ${{ vars.FHH_KAKAO_JS_KEY }}
      - name: Generate native Android project
        run: npx cap add android && npx cap sync android
      - name: Set Android version from package
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid app version');
          const versionCode = 1000 + Number(process.env.GITHUB_RUN_NUMBER);
          const path = 'android/app/build.gradle';
          const gradle = fs.readFileSync(path, 'utf8');
          if (!/versionCode \d+/.test(gradle) || !/versionName "[^"]+"/.test(gradle)) throw new Error('Android version fields missing');
          fs.writeFileSync(path, gradle.replace(/versionCode \d+/, 'versionCode ' + versionCode).replace(/versionName "[^"]+"/, 'versionName "' + version + '"'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          console.log('Android ' + version + ' (code ' + versionCode + ')');
          NODE
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: family-health-hub-android-v${{ steps.version.outputs.version }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
